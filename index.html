<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLOWERBX — hero scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<!-- ?v= is a cache buster. GitHub Pages serves assets with a 10 minute
     cache, so without it a new index.html happily runs the previous
     main.js. Bump it whenever the CSS or JS changes. -->
<link rel="stylesheet" href="./src/styles.css?v=4">
</head>
<body>

<!--
  Hero scene only. One full-bleed looping film, one headline that assembles
  itself out of the wind on load. No scroll, no sections, nothing below.
-->
<section class="hero" data-hero>

  <!-- Encoded for PLAYBACK: normal GOP and native 24fps. The previous file
       was all-intra at a forced 30fps, which is right for scrubbing and wrong
       for playing -- see README. Ping-pong (forward then reversed) so the
       loop point is the last frame meeting itself, with no cut back to the
       garden. -->
  <video class="hero__film" data-video
         src="https://d2ol7oe51mr4n9.cloudfront.net/user_3FE0Xjh16Sot9aoCPbOwO7vYemS/1bfb98f1-26e2-4ee1-804a-fc78b8e3a065.mp4"
         poster="https://d8j0ntlcm91z4.cloudfront.net/user_3FE0Xjh16Sot9aoCPbOwO7vYemS/hf_20260803_164720_9974793f-90e0-4f7f-b4d6-b8003d42eeda.png"
         autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>

  <div class="scrim" aria-hidden="true"></div>

  <header class="masthead">
    <span class="masthead__mark">FLOWERBX</span>
    <nav class="masthead__nav">
      <span>Shop</span>
      <span>Studio</span>
      <span>Subscriptions</span>
    </nav>
  </header>

  <div class="statement">
    <h1 class="statement__line" data-reveal>Everything<br><em>in season</em></h1>
    <p class="statement__sub" data-reveal-after>One flower, never mixed. Cut this morning, delivered before noon.</p>
  </div>

  <!-- Unofficial-concept credit. One line; delete it if it is in the way of
       a clean capture. -->
  <p class="credit">Unofficial concept — not affiliated with FLOWERBX Ltd.</p>

</section>

<script type="module" src="./src/main.js?v=4"></script>
</body>
</html>
